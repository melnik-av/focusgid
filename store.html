<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог прогулок</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            background: #fafafa; 
            color: #1a1a1a; 
            min-height: 100vh;
        }
        
        h1 { 
            margin: 0 0 8px 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 15px;
            color: #999999;
            margin-bottom: 30px;
        }
        
        .walks-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .walk-item {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: all 0.2s;
        }
        
        .walk-item:hover {
            border-color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        
        .walk-cover {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f5f5f5;
            position: relative;
            cursor: pointer;
        }
        
        .walk-cover img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }
        
        .walk-cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0e0e0 0%, #cccccc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        /* Оверлей с иконкой play */
        .walk-cover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .walk-cover:hover .walk-cover-overlay {
            opacity: 1;
        }
        
        .walk-cover.playing .walk-cover-overlay {
            opacity: 1;
            background: rgba(0, 0, 0, 0.6);
        }
        
        .play-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #1a1a1a;
            transition: transform 0.2s;
        }
        
        .walk-cover:hover .play-icon {
            transform: scale(1.1);
        }
        
        .walk-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }
        
        .walk-title { 
            font-weight: 600; 
            font-size: 18px; 
            line-height: 1.3;
            color: #1a1a1a;
        }
        
        .walk-description { 
            font-size: 13px; 
            color: #999999; 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .walk-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #666666;
            flex-wrap: wrap;
        }
        
        .walk-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
            font-size: 16px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
        }
        
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 16px; line-height: 1.5; }
        
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #e94560;
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            body { padding: 20px 16px; }
            h1 { font-size: 26px; }
            .walk-cover { width: 80px; height: 80px; }
            .walk-title { font-size: 16px; }
            .play-icon { width: 30px; height: 30px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <h1>Каталог прогулок</h1>
    <div class="subtitle">Нажмите на обложку для превью · на название для открытия</div>
    
    <div id="walksList" class="loading">
        Загрузка...
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';
        
        let currentAudio = null;
        let currentPreviewId = null;
        let previewTimeout = null;
        
        async function loadWalks() {
            const container = document.getElementById('walksList');
            
            try {
                const { data: walks, error } = await supabase
                    .from('tracks')
                    .select('*')
                    .eq('active', true)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                if (!walks || walks.length === 0) {
                    container.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">🎧</div>
                            <div class="empty-text">Пока нет доступных прогулок</div>
                        </div>
                    `;
                    return;
                }
                
                container.className = 'walks-list';
                
                container.innerHTML = walks.map(walk => {
                    const coverHtml = walk.cover_url 
                        ? '<img src="' + walk.cover_url + '" alt="' + walk.title + '">'
                        : '<div class="walk-cover-placeholder">🎧</div>';
                    
                    const duration = formatDuration(walk.duration);
                    const durationHtml = duration ? '<span class="walk-meta-item">🕐 ' + duration + '</span>' : '';
                    const priceHtml = '<span class="walk-meta-item">' + walk.price + ' руб</span>';
                    const daysHtml = '<span class="walk-meta-item">' + walk.duration_days + ' дней</span>';
                    
                    const descriptionHtml = walk.description 
                        ? '<div class="walk-description">' + walk.description + '</div>'
                        : '';
                    
                    return '<div class="walk-item">' +
                        '<div class="walk-cover" id="cover-' + walk.id + '" onclick="togglePreview(\'' + walk.id + '\', \'' + walk.file_url.replace(/'/g, "\\'") + '\')">' +
                            coverHtml +
                            '<div class="walk-cover-overlay">' +
                                '<div class="play-icon" id="play-icon-' + walk.id + '">▶</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="walk-info" onclick="openWalk(\'' + walk.id + '\')">' +
                            '<div class="walk-title">' + walk.title + '</div>' +
                            descriptionHtml +
                            '<div class="walk-meta">' +
                                priceHtml +
                                durationHtml +
                                daysHtml +
                            '</div>' +
                        '</div>' +
                    '</div>';
                }).join('');
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = '<div class="error">Ошибка загрузки каталога</div>';
            }
        }
        
        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '';
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) {
                return hours + ':' + mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
            } else {
                return mins + ':' + secs.toString().padStart(2, '0');
            }
        }
        
        window.togglePreview = async (id, audioUrl) => {
            const cover = document.getElementById('cover-' + id);
            const playIcon = document.getElementById('play-icon-' + id);
            
            // Если уже играет этот трек — останавливаем
            if (currentPreviewId === id && currentAudio) {
                stopPreview();
                return;
            }
            
            // Останавливаем предыдущий превью
            stopPreview();
            
            // Создаём новый аудио элемент
            currentAudio = new Audio(audioUrl);
            currentAudio.preload = 'auto';
            
            try {
                await currentAudio.play();
                
                // Показываем иконку паузы
                cover.classList.add('playing');
                playIcon.textContent = '⏸';
                currentPreviewId = id;
                
                // Останавливаем через 30 секунд
                previewTimeout = setTimeout(() => {
                    stopPreview();
                }, 30000);
                
                // Если аудио закончилось раньше
                currentAudio.addEventListener('ended', () => {
                    stopPreview();
                });
                
            } catch (error) {
                console.error('Ошибка воспроизведения:', error);
            }
        };
        
        window.stopPreview = () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.src = '';
                currentAudio = null;
            }
            
            if (previewTimeout) {
                clearTimeout(previewTimeout);
                previewTimeout = null;
            }
            
            if (currentPreviewId) {
                const cover = document.getElementById('cover-' + currentPreviewId);
                const playIcon = document.getElementById('play-icon-' + currentPreviewId);
                if (cover) cover.classList.remove('playing');
                if (playIcon) playIcon.textContent = '▶';
                currentPreviewId = null;
            }
        };
        
        window.openWalk = (id) => {
            stopPreview();
            window.location.href = 'index.html?track=' + id;
        };
        
        loadWalks();
    </script>
</body>
</html>
