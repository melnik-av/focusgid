<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои прогулки</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 40px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a1a1a;
        }
        
        .walks-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .walk-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .walk-item:hover { opacity: 0.7; }
        .walk-item:active { opacity: 0.5; }
        
        .walk-cover {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f0f0f0;
        }
        
        .walk-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .walk-cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .walk-info {
            flex: 1;
            min-width: 0;
        }
        
        .walk-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .walk-duration {
            font-size: 14px;
            color: #999999;
            font-variant-numeric: tabular-nums;
        }
        
        .walk-menu {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        
        .walk-menu:hover { background: #f5f5f5; }
        
        .walk-menu-dots {
            display: flex;
            gap: 3px;
        }
        
        .walk-menu-dots span {
            width: 5px;
            height: 5px;
            background: #999999;
            border-radius: 50%;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999999;
            font-size: 16px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
        }
        
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 16px; line-height: 1.5; }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .modal-action {
            padding: 16px;
            background: #f5f5f5;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .modal-action:hover { background: #e8e8e8; }
        .modal-action.danger { color: #e94560; }
        
        .modal-close {
            margin-top: 16px;
            padding: 16px;
            background: #1a1a1a;
            color: white;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 28px; }
            .walk-cover { width: 70px; height: 70px; }
            .walk-title { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мои прогулки</h1>
        
        <div id="walksList" class="loading">
            Загрузка...
        </div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Действия</div>
            <div class="modal-actions">
                <div class="modal-action" id="actionPlay">▶️ Слушать</div>
                <div class="modal-action" id="actionShare">📤 Поделиться</div>
                <div class="modal-action danger" id="actionDelete">🗑️ Удалить</div>
            </div>
            <div class="modal-close" id="modalClose">Отмена</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';
        
        let currentWalk = null;
        
        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '—';
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) {
                return `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }
        
        async function loadWalks() {
            try {
                console.log('📥 Загрузка списка прогулок...');
                const { data: walks, error } = await supabase
                    .from('tracks')
                    .select('*')
                    .eq('active', true)
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('❌ Ошибка загрузки из БД:', error);
                    throw error;
                }
                
                console.log('✅ Загружено треков:', walks?.length || 0);
                
                const container = document.getElementById('walksList');
                
                if (!walks || walks.length === 0) {
                    container.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon"></div>
                            <div class="empty-text">У вас пока нет прогулок</div>
                        </div>
                    `;
                    return;
                }
                
                container.className = 'walks-list';
                
                // Рендерим список
                container.innerHTML = walks.map(walk => {
                    const coverHtml = walk.cover_url 
                        ? `<img src="${walk.cover_url}" alt="${walk.title}">`
                        : `<div class="walk-cover-placeholder">🎧</div>`;
                    
                    // Показываем длительность из БД или "Загрузка..."
                    const durationText = walk.duration 
                        ? formatDuration(walk.duration) 
                        : '⏳';
                    
                    return `
                        <div class="walk-item" data-id="${walk.id}">
                            <div class="walk-cover">
                                ${coverHtml}
                            </div>
                            <div class="walk-info">
                                <div class="walk-title">${walk.title}</div>
                                <div class="walk-duration" id="duration-${walk.id}">${durationText}</div>
                            </div>
                            <div class="walk-menu" data-id="${walk.id}">
                                <div class="walk-menu-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Для треков без duration - определяем на лету
                const walksWithoutDuration = walks.filter(w => !w.duration);
                
                console.log(`🎵 Треков без длительности: ${walksWithoutDuration.length}`);
                
                if (walksWithoutDuration.length > 0) {
                    // Определяем последовательно
                    for (const walk of walksWithoutDuration) {
                        try {
                            console.log(`⏱️ Определяю длительность: ${walk.title}`);
                            const duration = await getAudioDuration(walk.file_url);
                            const roundedDuration = Math.round(duration);
                            
                            console.log(`✅ ${walk.title}: ${formatDuration(roundedDuration)}`);
                            
                            // Обновляем отображение
                            const durationEl = document.getElementById(`duration-${walk.id}`);
                            if (durationEl) {
                                durationEl.textContent = formatDuration(roundedDuration);
                            }
                            
                            // Сохраняем в БД
                            const { error: updateError } = await supabase
                                .from('tracks')
                                .update({ duration: roundedDuration })
                                .eq('id', walk.id);
                            
                            if (updateError) {
                                console.error(`❌ Ошибка сохранения в БД:`, updateError);
                            } else {
                                console.log(`💾 Сохранено в БД`);
                            }
                            
                        } catch (e) {
                            console.error(`❌ Ошибка определения длительности ${walk.title}:`, e);
                            const durationEl = document.getElementById(`duration-${walk.id}`);
                            if (durationEl) {
                                durationEl.textContent = '—';
                            }
                        }
                        
                        // Небольшая пауза между треками
                        await new Promise(resolve => setTimeout(resolve, 500));
                    }
                }
                
                // Обработчики кликов
                document.querySelectorAll('.walk-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (!e.target.closest('.walk-menu')) {
                            const walkId = item.dataset.id;
                            console.log(' Переход к треку:', walkId);
                            window.location.href = `index.html?track=${walkId}`;
                        }
                    });
                });
                
                document.querySelectorAll('.walk-menu').forEach(menu => {
                    menu.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const walkId = menu.dataset.id;
                        const walk = walks.find(w => w.id === walkId);
                        openModal(walk);
                    });
                });
                
            } catch (error) {
                console.error('💥 Критическая ошибка:', error);
                document.getElementById('walksList').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">❌</div>
                        <div class="empty-text">Ошибка загрузки прогулок</div>
                        <div style="font-size: 12px; margin-top: 10px; color: #e94560;">${error.message}</div>
                    </div>
                `;
            }
        }
        
        function getAudioDuration(url) {
            return new Promise((resolve, reject) => {
                console.log('🔊 Загрузка метаданных:', url);
                
                const audio = new Audio();
                audio.preload = 'metadata';
                
                const timeout = setTimeout(() => {
                    console.error(' Таймаут загрузки метаданных');
                    audio.src = '';
                    reject(new Error('Таймаут'));
                }, 10000);
                
                audio.addEventListener('loadedmetadata', () => {
                    console.log('✅ Метаданные загружены, длительность:', audio.duration);
                    clearTimeout(timeout);
                    audio.src = '';
                    resolve(audio.duration);
                });
                
                audio.addEventListener('error', (e) => {
                    console.error('❌ Ошибка загрузки аудио:', e);
                    clearTimeout(timeout);
                    audio.src = '';
                    reject(new Error('Ошибка загрузки'));
                });
                
                // Добавляем timestamp чтобы избежать кэширования
                audio.src = url + '?t=' + Date.now();
            });
        }
        
        function openModal(walk) {
            currentWalk = walk;
            document.getElementById('modalTitle').textContent = walk.title;
            document.getElementById('modalOverlay').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentWalk = null;
        }
        
        document.getElementById('modalClose').addEventListener('click', closeModal);
        
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });
        
        document.getElementById('actionPlay').addEventListener('click', () => {
            if (currentWalk) {
                window.location.href = `index.html?track=${currentWalk.id}`;
            }
        });
        
        document.getElementById('actionShare').addEventListener('click', async () => {
            if (currentWalk) {
                const shareUrl = `${window.location.origin}/index.html?track=${currentWalk.id}`;
                try {
                    if (navigator.share) {
                        await navigator.share({ title: currentWalk.title, url: shareUrl });
                    } else {
                        await navigator.clipboard.writeText(shareUrl);
                        alert('Ссылка скопирована!');
                    }
                } catch (error) {
                    console.error('Ошибка поделиться:', error);
                }
            }
        });
        
        document.getElementById('actionDelete').addEventListener('click', () => {
            if (currentWalk && confirm(`Удалить "${currentWalk.title}"?`)) {
                alert('Функция удаления будет добавлена позже');
            }
        });
        
        console.log('🚀 Инициализация страницы "Мои прогулки"');
        loadWalks();
    </script>
</body>
</html>
