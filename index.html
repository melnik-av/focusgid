<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиопрогулка</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            background: #fafafa; 
            color: #1a1a1a; 
            min-height: 100vh;
        }
        
        #coverContainer {
            width: 280px;
            height: 280px;
            border-radius: 24px;
            overflow: hidden;
            margin: 0 auto 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #coverContainer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .cover-placeholder {
            font-size: 80px;
            color: #ffffff;
        }
        
        #trackTitle {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }
        
        #trackDescription {
            font-size: 14px;
            color: #666666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        
        #trackDescription.hidden {
            display: none;
        }
        
        #loadingState {
            text-align: center;
        }
        
        #loadingState .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #1a1a1a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #keyForm {
            max-width: 400px;
            margin: 40px auto;
        }
        
        #keyForm input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
            font-family: inherit;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        #keyForm input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        #activateBtn {
            width: 100%;
            padding: 16px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        
        #activateBtn:hover {
            background: #333333;
        }
        
        #errorState {
            background: #fff0f0;
            color: #e94560;
            padding: 16px 24px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }
        
        #errorState.hidden {
            display: none;
        }
        
        #progressContainer {
            margin-top: 32px;
        }
        
        #progressContainer.hidden {
            display: none;
        }
        
        #progressBarWrapper {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        #progressBarFill {
            height: 100%;
            background: #1a1a1a;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999999;
            font-variant-numeric: tabular-nums;
            margin-bottom: 24px;
        }
        
        #playBtn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: #1a1a1a;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.2s;
            position: relative;
        }
        
        #playBtn:hover {
            background: #333333;
            transform: scale(1.05);
        }
        
        #playBtn:active {
            transform: scale(0.95);
        }
        
        #playBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #playBtn.hidden {
            display: none;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loadingState">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>

    <div id="coverContainer"></div>
    <h1 id="trackTitle"></h1>
    <p id="trackDescription" class="hidden"></p>

    <div id="keyForm" class="hidden">
        <input type="text" id="keyInput" placeholder="Введите ключ доступа">
        <button id="activateBtn">Активировать</button>
    </div>

    <div id="errorState" class="hidden"></div>

    <div id="progressContainer" class="hidden">
        <div id="progressBarWrapper">
            <div id="progressBarFill"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <button id="playBtn">
            <span id="buttonText">Играть</span>
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
