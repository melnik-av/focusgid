<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиопрогулка</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loadingState">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>

    <div id="coverContainer"></div>
    <h1 id="trackTitle"></h1>
    <p id="trackDescription" class="hidden"></p>

    <div id="keyForm" class="hidden">
        <input type="text" id="keyInput" placeholder="Введите ключ доступа">
        <button id="activateBtn">Активировать</button>
    </div>

    <div id="errorState" class="hidden"></div>

    <div id="progressContainer" class="hidden">
        <div class="progress-row">
            <div class="time-left" id="currentTime">0:00</div>
            <div id="progressBarWrapper">
                <div id="progressBarFill"></div>
            </div>
            <div class="time-right" id="totalTime">0:00</div>
        </div>
        <button id="playBtn">
            <span id="buttonText">Играть</span>
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
