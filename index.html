<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Иммерсивная прогулка</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .player {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        
        .cover-container {
            width: 220px;
            height: 220px;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            background: #f0f0f0;
        }
        
        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        
        .track-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        
        .track-description {
            font-size: 15px;
            color: #666666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        /* Контейнер вейвформы + времени */
        .waveform-container {
            width: 100%;
            padding: 0 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* Вейвформа */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 40px;
            flex: 1;
            margin: 0;
        }
        
        .wave-bar {
            width: 3px;
            background: #d0d0d0;
            border-radius: 2px;
            transition: background 0.2s;
            min-height: 4px;
        }
        
        .wave-bar.active {
            background: #1a1a1a;
        }
        
        /* Время слева и справа от вейвформы */
        .time-display {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #666666;
            font-variant-numeric: tabular-nums;
            min-width: 50px;
            height: 40px;
        }
        
        .time-display span {
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        /* Левое время */
        .time-current {
            text-align: right;
            justify-content: flex-end;
        }
        
        /* Правое время */
        .time-total {
            text-align: left;
            justify-content: flex-start;
        }
        
        /* Кнопка Play/Pause/Loading */
        .play-button {
            width: 100%;
            max-width: 320px;
            padding: 20px 40px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 64px;
            position: relative;
        }
        
        .play-button:hover:not(:disabled) {
            background: #333333;
            transform: scale(1.02);
        }
        
        .play-button:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        .play-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        /* Спиннер загрузки */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Текст кнопки */
        .button-text {
            display: inline-block;
        }
        
        .loading-state {
            text-align: center;
            color: #666666;
            padding: 40px 20px;
        }
        
        .error-state {
            text-align: center;
            color: #e94560;
            padding: 20px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 12px;
            margin: 20px 0;
            width: 100%;
        }
        
        .key-form {
            width: 100%;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 16px;
            margin: 20px 0;
        }
        
        .key-form p {
            font-size: 15px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .key-form input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: white;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-family: monospace;
        }
        
        .key-form input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        .key-form button {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 480px) {
            .cover-container {
                width: 180px;
                height: 180px;
            }
            
            .track-title {
                font-size: 22px;
            }
            
            .track-description {
                font-size: 14px;
            }
            
            .waveform-container {
                gap: 10px;
            }
            
            .time-display {
                min-width: 40px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="player">
        <div class="cover-container" id="coverContainer">
            <div class="cover-placeholder"></div>
        </div>
        
        <h1 class="track-title" id="trackTitle">Загрузка...</h1>
        
        <p class="track-description hidden" id="trackDescription"></p>
        
        <div class="loading-state" id="loadingState">
            Подключение...
        </div>
        
        <div class="key-form hidden" id="keyForm">
            <p>Введите ключ доступа для прослушивания:</p>
            <input type="text" id="keyInput" placeholder="XXXXXXXXXXXXXXXX" maxlength="20">
            <button id="activateBtn">Активировать</button>
        </div>
        
        <div class="error-state hidden" id="errorState"></div>
        
        <div class="waveform-container hidden" id="waveformContainer">
            <div class="time-display time-current">
                <span id="currentTime">0:00</span>
            </div>
            <div class="waveform" id="waveform"></div>
            <div class="time-display time-total">
                <span id="totalTime">0:00</span>
            </div>
        </div>
        
        <button class="play-button hidden" id="playBtn" disabled>
            <span class="button-text" id="buttonText">Загрузка...</span>
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
