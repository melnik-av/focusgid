<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Иммерсивная прогулка</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            overflow-x: hidden;
            max-width: 100vw;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .player {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Контейнер обложки с волной на фоне */
        .cover-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        
        /* SVG волна на фоне */
        .waveform-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 400px;
            height: auto;
            pointer-events: none;
            z-index: 1;
        }
        
        .waveform-bg rect {
            fill: #c8c8c8;
            rx: 2;
        }
        
        /* Обложка поверх волны */
        .cover-container {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            background: #f0f0f0;
            z-index: 2;
        }
        
        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        
        .track-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        
        .track-description {
            font-size: 15px;
            color: #666666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 24px;
            padding: 0 10px;
        }
        
        /* Прогресс-бар с временем */
        .progress-container {
            width: 100%;
            padding: 0 10px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .time-label {
            font-size: 14px;
            color: #1a1a1a;
            font-variant-numeric: tabular-nums;
            min-width: 45px;
            font-weight: 500;
        }
        
        .time-label.current {
            text-align: right;
        }
        
        .time-label.total {
            text-align: left;
        }
        
        .progress-bar-wrapper {
            flex: 1;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #1a1a1a;
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        
        /* Кнопка Play/Pause/Loading */
        .play-button {
            width: 100%;
            max-width: 320px;
            padding: 20px 40px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 64px;
            position: relative;
        }
        
        .play-button:hover:not(:disabled) {
            background: #333333;
            transform: scale(1.02);
        }
        
        .play-button:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        .play-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        /* Спиннер загрузки */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button-text {
            display: inline-block;
        }
        
        .loading-state {
            text-align: center;
            color: #666666;
            padding: 20px;
        }
        
        .error-state {
            text-align: center;
            color: #e94560;
            padding: 20px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 12px;
            margin: 20px 0;
            width: 100%;
        }
        
        .key-form {
            width: 100%;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 16px;
            margin: 20px 0;
        }
        
        .key-form p {
            font-size: 15px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .key-form input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: white;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-family: monospace;
        }
        
        .key-form input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        .key-form button {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 480px) {
            .cover-wrapper {
                height: 240px;
            }
            
            .cover-container {
                width: 180px;
                height: 180px;
            }
            
            .waveform-bg {
                width: 100%;
                max-width: 320px;
            }
            
            .track-title {
                font-size: 22px;
            }
            
            .track-description {
                font-size: 14px;
            }
            
            .time-label {
                font-size: 13px;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="player">
        <!-- Обложка с SVG-волной на фоне -->
        <div class="cover-wrapper">
            <svg class="waveform-bg" viewBox="0 0 560 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="50" width="6" height="20" rx="3"/>
                <rect x="18" y="30" width="6" height="60" rx="3"/>
                <rect x="31" y="45" width="6" height="30" rx="3"/>
                <rect x="44" y="20" width="6" height="80" rx="3"/>
                <rect x="57" y="40" width="6" height="40" rx="3"/>
                <rect x="70" y="15" width="6" height="90" rx="3"/>
                <rect x="83" y="35" width="6" height="50" rx="3"/>
                <rect x="96" y="10" width="6" height="100" rx="3"/>
                <rect x="109" y="45" width="6" height="30" rx="3"/>
                <rect x="122" y="25" width="6" height="70" rx="3"/>
                <rect x="135" y="50" width="6" height="20" rx="3"/>
                <rect x="148" y="15" width="6" height="90" rx="3"/>
                <rect x="161" y="35" width="6" height="50" rx="3"/>
                <rect x="174" y="5" width="6" height="110" rx="3"/>
                <rect x="187" y="40" width="6" height="40" rx="3"/>
                <rect x="200" y="20" width="6" height="80" rx="3"/>
                <rect x="213" y="45" width="6" height="30" rx="3"/>
                <rect x="226" y="10" width="6" height="100" rx="3"/>
                <rect x="239" y="30" width="6" height="60" rx="3"/>
                <rect x="252" y="50" width="6" height="20" rx="3"/>
                <rect x="265" y="15" width="6" height="90" rx="3"/>
                <rect x="278" y="40" width="6" height="40" rx="3"/>
                <rect x="291" y="5" width="6" height="110" rx="3"/>
                <rect x="304" y="25" width="6" height="70" rx="3"/>
                <rect x="317" y="45" width="6" height="30" rx="3"/>
                <rect x="330" y="10" width="6" height="100" rx="3"/>
                <rect x="343" y="35" width="6" height="50" rx="3"/>
                <rect x="356" y="20" width="6" height="80" rx="3"/>
                <rect x="369" y="50" width="6" height="20" rx="3"/>
                <rect x="382" y="15" width="6" height="90" rx="3"/>
                <rect x="395" y="40" width="6" height="40" rx="3"/>
                <rect x="408" y="5" width="6" height="110" rx="3"/>
                <rect x="421" y="30" width="6" height="60" rx="3"/>
                <rect x="434" y="45" width="6" height="30" rx="3"/>
                <rect x="447" y="10" width="6" height="100" rx="3"/>
                <rect x="460" y="25" width="6" height="70" rx="3"/>
                <rect x="473" y="50" width="6" height="20" rx="3"/>
                <rect x="486" y="15" width="6" height="90" rx="3"/>
                <rect x="499" y="35" width="6" height="50" rx="3"/>
                <rect x="512" y="20" width="6" height="80" rx="3"/>
                <rect x="525" y="45" width="6" height="30" rx="3"/>
                <rect x="538" y="10" width="6" height="100" rx="3"/>
                <rect x="551" y="40" width="6" height="40" rx="3"/>
            </svg>
            <div class="cover-container" id="coverContainer">
                <div class="cover-placeholder"></div>
            </div>
        </div>
        
        <h1 class="track-title" id="trackTitle">Загрузка...</h1>
        
        <p class="track-description hidden" id="trackDescription"></p>
        
        <div class="loading-state" id="loadingState">
            Подключение...
        </div>
        
        <div class="key-form hidden" id="keyForm">
            <p>Введите ключ доступа для прослушивания:</p>
            <input type="text" id="keyInput" placeholder="XXXXXXXXXXXXXXXX" maxlength="20">
            <button id="activateBtn">Активировать</button>
        </div>
        
        <div class="error-state hidden" id="errorState"></div>
        
        <!-- Прогресс-бар -->
        <div class="progress-container hidden" id="progressContainer">
            <div class="time-label current" id="currentTime">0:00</div>
            <div class="progress-bar-wrapper" id="progressBarWrapper">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="time-label total" id="totalTime">0:00</div>
        </div>
        
        <button class="play-button hidden" id="playBtn" disabled>
            <span class="button-text" id="buttonText">Загрузка...</span>
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
