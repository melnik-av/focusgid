<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fafafa">
    <title>Аудиопрогулка</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        
        html, body {
            overscroll-behavior: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .player-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            max-height: 100vh;
        }
        
        .cover-container {
            width: 280px;
            height: 280px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            margin-bottom: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
        }
        
        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        
        .track-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }
        
        .track-description {
            font-size: 15px;
            color: #666666;
            text-align: center;
            line-height: 1.5;
            margin: 0 0 32px 0;
            padding: 0 20px;
        }
        
        .track-description.hidden { display: none; }
        
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        
        .loading-state.hidden { display: none; }
        
        .loading-text {
            font-size: 24px;
            font-weight: 700;
        }
        
        .error-state {
            background: #fff5f7;
            color: #e94560;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 15px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        .error-state.hidden { display: none; }
        
        .key-form {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .key-form.hidden { display: none; }
        
        .key-form input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .key-form input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        .key-form button {
            width: 100%;
            padding: 16px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        
        .key-form button:hover {
            background: #333333;
        }
        
        .progress-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        
        .progress-container.hidden { display: none; }
        
        .progress-bar-wrapper {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #1a1a1a;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
            color: #999999;
            font-variant-numeric: tabular-nums;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: #1a1a1a;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-top: 20px;
            position: relative;
        }
        
        .play-button:hover {
            background: #333333;
            transform: scale(1.05);
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
        
        .play-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .play-button.hidden { display: none; }
        
        .button-text {
            font-size: 16px;
            font-weight: 500;
        }
        
        .button-text.hidden { display: none; }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 480px) {
            .cover-container {
                width: 240px;
                height: 240px;
            }
            
            .track-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="loading-state" id="loadingState">
            <div class="cover-container">
                <div class="cover-placeholder">🎧</div>
            </div>
            <div class="loading-text">Загрузка...</div>
        </div>
        
        <div class="error-state hidden" id="errorState"></div>
        
        <div class="key-form hidden" id="keyForm">
            <input type="text" id="keyInput" placeholder="Введите ключ доступа" autocomplete="off">
            <button id="activateBtn">Активировать</button>
        </div>
        
        <div class="cover-container" id="coverContainer" style="display: none;">
            <div class="cover-placeholder">🎧</div>
        </div>
        
        <h1 class="track-title" id="trackTitle" style="display: none;"></h1>
        <p class="track-description hidden" id="trackDescription"></p>
        
        <button class="play-button hidden" id="playBtn" disabled>
            <span class="button-text" id="buttonText">Играть</span>
        </button>
        
        <div class="progress-container hidden" id="progressContainer">
            <div class="progress-bar-wrapper" id="progressBarWrapper">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
