            align-items: center;

            height: 280px;

            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        
        .waveform-bg {
            position: absolute;

            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 400px;
            height: auto;
            pointer-events: none;
            z-index: 1;
        }
        
        .waveform-bg rect {
            fill: #c8c8c8;
        }

            background: #f0f0f0;
            z-index: 2;
        }
