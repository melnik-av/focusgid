<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            background: #fafafa; 
            color: #1a1a1a; 
            min-height: 100vh;
        }
        
        h1 { 
            margin: 0 0 24px 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-size: 16px;
            font-weight: 500;
            color: #666666;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: #1a1a1a;
        }
        
        .tab.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .add-btn {
            background: #1a1a1a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        
        .add-btn:hover {
            background: #333333;
        }
        
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .item-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }
        
        .item-card:hover {
            border-color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }
        
        .item-title {
            font-weight: 600;
            font-size: 18px;
            color: #1a1a1a;
            margin: 0;
        }
        
        .item-description {
            font-size: 14px;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        
        .item-meta {
            font-size: 13px;
            color: #999999;
            margin-bottom: 16px;
        }
        
        .item-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #1a1a1a;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #f5f5f5;
            border-color: #1a1a1a;
        }
        
        .btn-primary {
            background: #1a1a1a;
            color: #ffffff;
            border: none;
        }
        
        .btn-primary:hover {
            background: #333333;
        }
        
        .btn-danger {
            color: #e94560;
        }
        
        .btn-danger:hover {
            background: #fff5f7;
            border-color: #e94560;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 24px 0 24px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #666666;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-close:hover {
            background: #e0e0e0;
            color: #1a1a1a;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .field-label {
            font-size: 13px;
            color: #666666;
            margin-bottom: 6px;
            display: block;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0 16px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-footer {
            padding: 0 24px 24px 24px;
            display: flex;
            gap: 8px;
        }
        
        .modal-footer button {
            flex: 1;
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .user-email {
            font-size: 14px;
            color: #666666;
            margin-top: 4px;
        }
        
        .logout-btn {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            margin: 0;
        }
        
        .logout-btn:hover {
            background: #f5f5f5;
            border-color: #1a1a1a;
        }
        
        #loginForm {
            max-width: 400px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }
        
        #loginForm h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 480px) {
            body { padding: 20px 16px; }
            h1 { font-size: 26px; }
            .tabs { flex-direction: column; }
            .tab { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Войти</button>
        <div id="loginError" style="color: #e94560; margin-top: 10px; font-size: 14px; text-align: center;"></div>
    </div>
    
    <div id="adminPanel" class="hidden">
        <div class="user-info">
            <div>
                <div style="font-weight: 600; font-size: 14px;">Вы вошли как:</div>
                <div class="user-email" id="userEmail">—</div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <h1>Админ-панель</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('walks')"> Прогулки</button>
            <button class="tab" onclick="switchTab('tracks')">🎵 Аудиотреки</button>
        </div>
        
        <!-- Раздел Прогулки -->
        <div id="walksTab" class="tab-content active">
            <button class="add-btn" onclick="openWalkModal()">+ Добавить прогулку</button>
            <div id="walksList" class="item-list"></div>
        </div>
        
        <!-- Раздел Аудиотреки -->
        <div id="tracksTab" class="tab-content">
            <button class="add-btn" onclick="openTrackModal()">+ Загрузить трек</button>
            <div id="tracksList" class="item-list"></div>
        </div>
    </div>
    
    <!-- Модалка для прогулки -->
    <div class="modal-overlay" id="walkModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Добавить прогулку</h2>
                <button class="modal-close" onclick="closeWalkModal()"></button>
            </div>
            <div class="modal-body">
                <label class="field-label">Название прогулки *</label>
                <input type="text" id="walkTitle" placeholder="Например: Прогулка по старому городу">
                
                <label class="field-label">Описание</label>
                <textarea id="walkDescription" placeholder="Опишите прогулку..."></textarea>
                
                <label class="field-label">Аудиотрек</label>
                <select id="walkTrack">
                    <option value="">Без трека</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeWalkModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveWalk()">Сохранить</button>
            </div>
        </div>
    </div>
    
    <!-- Модалка для трека -->
    <div class="modal-overlay" id="trackModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Загрузить трек</h2>
                <button class="modal-close" onclick="closeTrackModal()">✕</button>
            </div>
            <div class="modal-body">
                <label class="field-label">Название трека *</label>
                <input type="text" id="trackTitle" placeholder="Например: Лесной резонанс">
                
                <label class="field-label">Аудиофайл (MP3) *</label>
                <input type="file" id="trackFile" accept="audio/mp3,audio/mpeg">
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeTrackModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveTrack()">Загрузить</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
