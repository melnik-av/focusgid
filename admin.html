<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="loginForm">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Войти</button>
        <div id="loginError" style="color: #e94560; margin-top: 10px; font-size: 14px; text-align: center;"></div>
    </div>
    
    <div id="adminPanel" class="hidden">
        <div class="user-info">
            <div>
                <div style="font-weight: 600; font-size: 14px;">Вы вошли как:</div>
                <div class="user-email" id="userEmail">—</div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <h1>Админ-панель</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('walks')">🚶 Прогулки</button>
            <button class="tab" onclick="switchTab('tracks')">🎵 Аудиотреки</button>
        </div>
        
        <div id="walksTab" class="tab-content active">
            <button class="add-btn" onclick="openWalkModal()">+ Добавить прогулку</button>
            <div id="walksList" class="item-list"></div>
        </div>
        
        <div id="tracksTab" class="tab-content">
            <button class="add-btn" onclick="openTrackModal()">+ Загрузить трек</button>
            <div id="tracksList" class="item-list"></div>
        </div>
    </div>
    
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <div class="modal-overlay" id="walkModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="walkModalTitle">Добавить прогулку</h2>
                <button class="modal-close" onclick="closeWalkModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="walk-form" id="walkForm">
                    <label class="field-label">Название прогулки *</label>
                    <input type="text" id="walkTitle" placeholder="Например: Прогулка по старому городу">
                    
                    <label class="field-label">Описание</label>
                    <textarea id="walkDescription" placeholder="Опишите прогулку..."></textarea>
                    
                    <label class="field-label">Тип прогулки *</label>
                    <div class="walk-type-selector">
                        <div class="walk-type-option">
                            <input type="radio" name="walkType" id="typeSolo" value="solo" checked onchange="onWalkTypeChange()">
                            <label for="typeSolo">🚶 Соло</label>
                        </div>
                        <div class="walk-type-option">
                            <input type="radio" name="walkType" id="typePair" value="pair" onchange="onWalkTypeChange()">
                            <label for="typePair">💑 Парная</label>
                        </div>
                        <div class="walk-type-option">
                            <input type="radio" name="walkType" id="typeGroup" value="group" onchange="onWalkTypeChange()">
                            <label for="typeGroup"> Групповая</label>
                        </div>
                    </div>
                    
                    <div class="cover-upload">
                        <label class="field-label">Обложка прогулки</label>
                        <div class="cover-preview" id="walkCoverPreview" onclick="document.getElementById('walkCoverFile').click()">
                            <div class="cover-preview-placeholder">
                                <span class="cover-icon">+</span>
                                Нажмите чтобы добавить обложку
                            </div>
                        </div>
                        <input type="file" id="walkCoverFile" accept="image/*" style="display: none;">
                    </div>
                    
                    <div class="single-track-field" id="singleTrackField">
                        <label class="field-label">Аудиотрек</label>
                        <select id="walkTrack">
                            <option value="">Без трека</option>
                        </select>
                    </div>
                    
                    <div class="pair-tracks" id="pairTracks">
                        <label class="field-label"> Трек для неё</label>
                        <select id="walkTrackFemale">
                            <option value="">Без трека</option>
                        </select>
                        
                        <label class="field-label">🎧 Трек для него</label>
                        <select id="walkTrackMale">
                            <option value="">Без трека</option>
                        </select>
                    </div>
                </div>
                
                <div class="upload-spinner-container" id="walkSpinner">
                    <div class="spinner"></div>
                    <div class="spinner-text" id="walkSpinnerText">Сохранение...</div>
                </div>
            </div>
            <div class="modal-footer" id="walkModalFooter">
                <button class="btn" onclick="closeWalkModal()">Отмена</button>
                <button class="btn btn-primary" id="saveWalkBtn" onclick="saveWalk()">Сохранить</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="trackModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Загрузить трек</h2>
                <button class="modal-close" onclick="closeTrackModal()"></button>
            </div>
            <div class="modal-body">
                <div class="upload-form" id="uploadForm">
                    <label class="field-label">Название трека *</label>
                    <input type="text" id="trackTitle" placeholder="Например: Лесной резонанс">
                    
                    <label class="field-label">Аудиофайл (MP3) *</label>
                    <input type="file" id="trackFile" accept="audio/mp3,audio/mpeg">
                </div>
                
                <div class="upload-spinner-container" id="uploadSpinner">
                    <div class="spinner"></div>
                    <div class="spinner-text" id="spinnerText">Загрузка файла...</div>
                </div>
            </div>
            <div class="modal-footer" id="trackModalFooter">
                <button class="btn" onclick="closeTrackModal()">Отмена</button>
                <button class="btn btn-primary" id="saveTrackBtn" onclick="saveTrack()">Загрузить</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="editTrackModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Редактировать трек</h2>
                <button class="modal-close" onclick="closeEditTrackModal()">✕</button>
            </div>
            <div class="modal-body">
                <label class="field-label">Название трека *</label>
                <input type="text" id="editTrackTitle" placeholder="Например: Лесной резонанс">
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeEditTrackModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveTrackName()">Сохранить</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
