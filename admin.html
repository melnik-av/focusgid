<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            background: #fafafa; 
            color: #1a1a1a; 
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        h1 { 
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .add-track-btn {
            background: #1a1a1a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            width: auto;
            margin: 0;
        }
        
        .add-track-btn:hover {
            background: #333333;
        }
        
        input, textarea, button { 
            padding: 14px 16px; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid #e0e0e0; 
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        input, textarea { 
            background: #ffffff; 
            color: #1a1a1a; 
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        input::placeholder, textarea::placeholder { 
            color: #999999; 
        }
        
        textarea { 
            resize: vertical; 
            min-height: 80px; 
        }
        
        button { 
            background: #1a1a1a; 
            color: #ffffff; 
            cursor: pointer; 
            font-weight: 500; 
            border: none;
        }
        
        button:hover { 
            background: #333333; 
        }
        
        button:disabled { 
            background: #cccccc; 
            cursor: not-allowed; 
        }
        
        .hidden { display: none !important; }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .user-email { 
            font-size: 14px; 
            color: #666666; 
            margin-top: 4px;
        }
        
        .logout-btn { 
            background: #ffffff; 
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            width: auto; 
            padding: 8px 16px; 
            font-size: 14px; 
            margin: 0; 
        }
        
        .logout-btn:hover { 
            background: #f5f5f5; 
            border-color: #1a1a1a;
        }
        
        .track-item {
            padding: 20px; 
            background: #ffffff; 
            margin: 16px 0; 
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            position: relative;
        }
        
        .track-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        
        .track-header-content {
            flex: 1;
            min-width: 0;
        }
        
        .track-title { 
            font-weight: 600; 
            font-size: 18px; 
            margin-bottom: 6px; 
        }
        
        .track-description { 
            font-size: 14px; 
            color: #666666; 
            margin-bottom: 8px; 
            line-height: 1.5; 
        }
        
        .track-meta { 
            font-size: 13px; 
            color: #999999;
            margin-bottom: 12px;
        }
        
        .track-cover-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .track-cover-thumb img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .track-link { 
            font-size: 12px; 
            color: #999999; 
            word-break: break-all;
            font-family: 'SF Mono', Monaco, monospace;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 6px;
        }
        
        .stats-row {
            display: flex;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value { 
            font-size: 22px; 
            font-weight: 700; 
            color: #1a1a1a; 
            margin-bottom: 4px; 
        }
        
        .stat-label { 
            font-size: 11px; 
            color: #999999; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        
        .menu-button {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #999999;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        .menu-button:hover {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        
        .dropdown-menu {
            position: absolute;
            top: 60px;
            right: 20px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            z-index: 100;
            display: none;
            overflow: hidden;
        }
        
        .dropdown-menu.active {
            display: block;
        }
        
        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            margin: 0;
            border-radius: 0;
        }
        
        .dropdown-item:hover {
            background: #f5f5f5;
        }
        
        .dropdown-item.danger {
            color: #e94560;
        }
        
        .dropdown-item.danger:hover {
            background: #fff5f7;
        }
        
        .dropdown-divider {
            height: 1px;
            background: #e0e0e0;
            margin: 4px 0;
        }
        
        .dropdown-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        .field-label { 
            font-size: 13px; 
            color: #666666; 
            margin-bottom: 6px; 
            display: block;
            font-weight: 500;
        }
        
        .edit-form {
            background: #f5f5f5;
            padding: 24px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .edit-form input, .edit-form textarea { 
            background: #ffffff; 
            margin-bottom: 12px; 
        }
        
        .edit-form .field-label { 
            color: #1a1a1a; 
            font-weight: 600; 
        }
        
        .edit-actions { 
            display: flex; 
            gap: 8px; 
            margin-top: 20px; 
        }
        
        .edit-actions button { 
            flex: 1; 
        }
        
        .total-stats {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }
        
        .total-stats h3 { 
            margin: 0 0 20px 0; 
            font-size: 18px;
            font-weight: 600;
        }
        
        .total-stats .stats-row { 
            margin: 0; 
        }
        
        /* Обложка — кликабельная область */
        .cover-upload { 
            margin: 16px 0; 
        }
        
        .cover-preview {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 2px dashed #e0e0e0;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        
        .cover-preview:hover {
            border-color: #1a1a1a;
            background: #f0f0f0;
        }
        
        .cover-preview img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            display: block;
        }
        
        .cover-preview-placeholder { 
            color: #999999; 
            font-size: 13px; 
            text-align: center; 
            padding: 20px;
            pointer-events: none;
            line-height: 1.4;
        }
        
        .cover-preview-placeholder .cover-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        
        /* Кнопка удаления обложки */
        .cover-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0;
            margin: 0;
            transition: all 0.2s;
            z-index: 2;
        }
        
        .cover-delete-btn:hover {
            background: #e94560;
            transform: scale(1.1);
        }
        
        #loginForm {
            max-width: 400px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }
        
        #loginForm h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
        }
        
        .menu-overlay.active {
            display: block;
        }
        
        /* Модальное окно добавления трека */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 24px 0 24px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #666666;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: #e0e0e0;
            color: #1a1a1a;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-body input,
        .modal-body textarea {
            margin: 8px 0 16px 0;
        }
        
        .modal-footer {
            padding: 0 24px 24px 24px;
            display: flex;
            gap: 8px;
        }
        
        .modal-footer button {
            flex: 1;
        }
        
        .btn-cancel-modal {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
        }
        
        .btn-cancel-modal:hover {
            background: #f5f5f5;
            border-color: #1a1a1a;
        }
        
        .modal-status {
            margin: 0 24px 16px 24px;
            padding: 12px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-height: 20px;
        }
        
        /* Статус загрузки */
        #status { 
            margin-top: 20px; 
            padding: 16px; 
            background: #ffffff; 
            border: 1px solid #e0e0e0;
            border-radius: 8px; 
            min-height: 20px; 
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .add-track-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div id="loginError" style="color: #e94560; margin-top: 10px; font-size: 14px;"></div>
    </div>
    
    <div id="adminPanel" class="hidden">
        <div class="user-info">
            <div>
                <div style="font-weight: 600; font-size: 14px;">Вы вошли как:</div>
                <div class="user-email" id="userEmail">—</div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <div class="header">
            <h1>Админ-панель</h1>
            <button class="add-track-btn" onclick="openAddModal()">+ Добавить трек</button>
        </div>
        
        <div class="total-stats" id="totalStats">
            <h3>📊 Общая статистика</h3>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalTracks">0</div>
                    <div class="stat-label">Всего треков</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPlays">0</div>
                    <div class="stat-label">Всего прослушиваний</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="topTrack">—</div>
                    <div class="stat-label">Самый популярный</div>
                </div>
            </div>
        </div>
        
        <h2>Список треков</h2>
        <div id="tracksList"></div>
    </div>
    
    <!-- Оверлей для меню -->
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <!-- Модальное окно добавления трека -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Добавить трек</h2>
                <button class="modal-close" onclick="closeAddModal()">✕</button>
            </div>
            <div class="modal-body">
                <label class="field-label">Название трека *</label>
                <input type="text" id="title" placeholder="Например: Прогулка по старому городу">
                
                <label class="field-label">Описание (аннотация)</label>
                <textarea id="description" placeholder="2-3 предложения о прогулке..."></textarea>
                
                <div class="cover-upload">
                    <label class="field-label">Обложка трека</label>
                    <div class="cover-preview" id="coverPreview" onclick="document.getElementById('coverFile').click()">
                        <div class="cover-preview-placeholder">
                            <span class="cover-icon">+</span>
                            Нажмите чтобы добавить обложку
                        </div>
                    </div>
                    <input type="file" id="coverFile" accept="image/*" style="display: none;">
                </div>
                
                <label class="field-label">Цена (руб)</label>
                <input type="number" id="price" placeholder="500" value="500">
                
                <label class="field-label">Дней доступа</label>
                <input type="number" id="days" placeholder="7" value="7">
                
                <label class="field-label">Аудиофайл (MP3) *</label>
                <input type="file" id="mp3file" accept="audio/mp3,audio/mpeg">
            </div>
            <div class="modal-status" id="modalStatus"></div>
            <div class="modal-footer">
                <button class="btn-cancel-modal" onclick="closeAddModal()">Отмена</button>
                <button onclick="uploadTrack()" id="uploadBtn">Загрузить трек</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let selectedCoverFile = null;
        let selectedCoverUrl = null;
        let currentMenuId = null;

        window.login = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.textContent = '❌ ' + error.message;
            }
        };

        window.logout = async () => {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert('Ошибка выхода: ' + error.message);
            }
        };

        supabase.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('userEmail').textContent = session.user.email;
                loadTracks();
            } else {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            }
        });

        // Модалка добавления трека
        window.openAddModal = () => {
            document.getElementById('addModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeAddModal = () => {
            const title = document.getElementById('title').value.trim();
            const file = document.getElementById('mp3file').files[0];
            
            if (title || file) {
                if (!confirm('Форма не заполнена. Закрыть без сохранения?')) {
                    return;
                }
            }
            
            document.getElementById('addModal').classList.remove('active');
            document.body.style.overflow = '';
            
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            document.getElementById('price').value = '500';
            document.getElementById('days').value = '7';
            document.getElementById('mp3file').value = '';
            removeCover();
            
            const status = document.getElementById('modalStatus');
            status.textContent = '';
            status.style.borderColor = '#e0e0e0';
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAllMenus();
            }
        });

        // Обработчик выбора обложки
        document.getElementById('coverFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedCoverFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedCoverUrl = e.target.result;
                    renderCoverPreview('coverPreview', e.target.result, true);
                };
                reader.readAsDataURL(file);
            }
        });

        // Рендер превью обложки (с кнопкой удаления или без)
        function renderCoverPreview(containerId, imageUrl, showDelete) {
            const container = document.getElementById(containerId);
            if (showDelete && imageUrl) {
                container.innerHTML = 
                    '<img src="' + imageUrl + '" alt="Обложка">' +
                    '<button class="cover-delete-btn" onclick="event.stopPropagation(); ' + 
                    (containerId === 'coverPreview' ? 'removeCover()' : 'removeEditCover(\'' + containerId.replace('edit-cover-preview-', '') + '\')') + 
                    '" title="Удалить обложку">🗑</button>';
            } else {
                container.innerHTML = 
                    '<div class="cover-preview-placeholder">' +
                        '<span class="cover-icon">+</span>' +
                        'Нажмите чтобы добавить обложку' +
                    '</div>';
            }
        }

        window.removeCover = () => {
            selectedCoverFile = null;
            selectedCoverUrl = null;
            document.getElementById('coverFile').value = '';
            renderCoverPreview('coverPreview', null, false);
        };

        function getQRUrl(text, size = 200) {
            return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(text) + '&margin=10&color=000000&bgcolor=ffffff';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '—';
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) {
                return hours + ':' + mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
            } else {
                return mins + ':' + secs.toString().padStart(2, '0');
            }
        }

        function closeAllMenus() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('active');
            });
            document.getElementById('menuOverlay').classList.remove('active');
            currentMenuId = null;
        }

        window.toggleMenu = (id) => {
            const menu = document.getElementById('menu-' + id);
            const overlay = document.getElementById('menuOverlay');
            
            if (currentMenuId === id) {
                closeAllMenus();
                return;
            }
            
            closeAllMenus();
            
            menu.classList.add('active');
            overlay.classList.add('active');
            currentMenuId = id;
        };

        document.getElementById('menuOverlay').addEventListener('click', closeAllMenus);

        async function loadTracks() {
            closeAllMenus();
            
            const { data: tracks, error } = await supabase
                .from('tracks')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Ошибка загрузки:', error);
                return;
            }
            
            updateTotalStats(tracks);
            
            const list = document.getElementById('tracksList');
            if (!tracks || tracks.length === 0) {
                list.innerHTML = '<div style="color: #999999; text-align: center; padding: 40px;">Нет треков</div>';
                return;
            }
            
            const playerUrl = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');
            
            list.innerHTML = tracks.map(t => {
                const trackLink = playerUrl + '?track=' + t.id;
                const descriptionHtml = t.description 
                    ? '<div class="track-description">' + t.description + '</div>' 
                    : '';
                const qrUrl = getQRUrl(trackLink, 200);
                const playCount = t.play_count || 0;
                const lastPlayed = formatDate(t.last_played_at);
                const duration = formatDuration(t.duration);
                const coverHtml = t.cover_url 
                    ? '<div class="track-cover-thumb"><img src="' + t.cover_url + '" alt="' + t.title + '"></div>'
                    : '';
                
                const statusText = t.active ? 'Отключить' : 'Включить';
                const statusIcon = t.active ? '' : '▶';
                
                return '<div class="track-item" id="track-' + t.id + '">' +
                    '<div class="track-header">' +
                        '<div class="track-header-content">' +
                            coverHtml +
                            '<div class="track-title">' + t.title + '</div>' +
                            descriptionHtml +
                            '<div class="track-meta">' + t.price + ' руб · ' + t.duration_days + ' дней · ' + duration + '</div>' +
                        '</div>' +
                        '<button class="menu-button" onclick="toggleMenu(\'' + t.id + '\')">⋯</button>' +
                    '</div>' +
                    
                    '<div class="dropdown-menu" id="menu-' + t.id + '">' +
                        '<button class="dropdown-item" onclick="copyLink(\'' + trackLink + '\', \'' + t.title.replace(/'/g, "\\'") + '\')">' +
                            '<span class="dropdown-icon"></span> Копировать ссылку' +
                        '</button>' +
                        '<button class="dropdown-item" onclick="downloadQR(\'' + qrUrl + '\', \'' + t.title.replace(/'/g, "\\'") + '\')">' +
                            '<span class="dropdown-icon"></span> Скачать QR-код' +
                        '</button>' +
                        '<div class="dropdown-divider"></div>' +
                        '<button class="dropdown-item" onclick="showEditForm(\'' + t.id + '\', \'' + t.title.replace(/'/g, "\\'") + '\', \'' + (t.description || '').replace(/'/g, "\\'") + '\', ' + t.price + ', ' + t.duration_days + ', \'' + (t.cover_url || '') + '\')">' +
                            '<span class="dropdown-icon">✏️</span> Редактировать' +
                        '</button>' +
                        '<button class="dropdown-item" onclick="toggleTrack(\'' + t.id + '\', ' + !t.active + ')">' +
                            '<span class="dropdown-icon">' + statusIcon + '</span> ' + statusText +
                        '</button>' +
                        '<div class="dropdown-divider"></div>' +
                        '<button class="dropdown-item danger" onclick="deleteTrack(\'' + t.id + '\')">' +
                            '<span class="dropdown-icon">🗑</span> Удалить' +
                        '</button>' +
                    '</div>' +
                    
                    '<div class="track-link">' + trackLink + '</div>' +
                    
                    '<div class="stats-row">' +
                        '<div class="stat-card">' +
                            '<div class="stat-value">' + playCount + '</div>' +
                            '<div class="stat-label">Прослушиваний</div>' +
                        '</div>' +
                        '<div class="stat-card">' +
                            '<div class="stat-value" style="font-size: 14px;">' + lastPlayed + '</div>' +
                            '<div class="stat-label">Последнее прослушивание</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function updateTotalStats(tracks) {
            const totalTracks = tracks.length;
            const totalPlays = tracks.reduce((sum, t) => sum + (t.play_count || 0), 0);
            
            let topTrack = tracks.reduce((max, t) => {
                return (t.play_count || 0) > (max.play_count || 0) ? t : max;
            }, tracks[0] || { play_count: 0, title: '—' });
            
            document.getElementById('totalTracks').textContent = totalTracks;
            document.getElementById('totalPlays').textContent = totalPlays;
            document.getElementById('topTrack').textContent = topTrack.play_count > 0 ? topTrack.title : '—';
        }

        window.showEditForm = (id, title, description, price, days, coverUrl) => {
            closeAllMenus();
            
            const trackItem = document.getElementById('track-' + id);
            const existingForm = trackItem.querySelector('.edit-form');
            
            if (existingForm) {
                existingForm.remove();
                return;
            }
            
            const form = document.createElement('div');
            form.className = 'edit-form';
            form.innerHTML = 
                '<label class="field-label">Название трека</label>' +
                '<input type="text" id="edit-title-' + id + '" value="' + title + '">' +
                
                '<label class="field-label">Описание</label>' +
                '<textarea id="edit-description-' + id + '">' + description + '</textarea>' +
                
                '<label class="field-label">Обложка</label>' +
                '<div class="cover-preview" id="edit-cover-preview-' + id + '" onclick="document.getElementById(\'edit-cover-file-' + id + '\').click()">' +
                '</div>' +
                '<input type="file" id="edit-cover-file-' + id + '" accept="image/*" style="display: none;">' +
                
                '<label class="field-label">Цена (руб)</label>' +
                '<input type="number" id="edit-price-' + id + '" value="' + price + '">' +
                
                '<label class="field-label">Дней доступа</label>' +
                '<input type="number" id="edit-days-' + id + '" value="' + days + '">' +
                
                '<div class="edit-actions">' +
                    '<button class="btn-save" onclick="saveTrack(\'' + id + '\', \'' + coverUrl + '\')">Сохранить</button>' +
                    '<button class="btn-cancel" onclick="loadTracks()">Отмена</button>' +
                '</div>';
            
            trackItem.appendChild(form);
            
            // Рендерим текущую обложку
            renderCoverPreview('edit-cover-preview-' + id, coverUrl, !!coverUrl);
            
            document.getElementById('edit-cover-file-' + id).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        renderCoverPreview('edit-cover-preview-' + id, e.target.result, true);
                        document.getElementById('edit-cover-file-' + id).dataset.newCover = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        };

        window.removeEditCover = (id) => {
            renderCoverPreview('edit-cover-preview-' + id, null, false);
            document.getElementById('edit-cover-file-' + id).value = '';
            delete document.getElementById('edit-cover-file-' + id).dataset.newCover;
        };

        window.saveTrack = async (id, oldCoverUrl) => {
            const title = document.getElementById('edit-title-' + id).value.trim();
            const description = document.getElementById('edit-description-' + id).value.trim();
            const price = parseInt(document.getElementById('edit-price-' + id).value);
            const days = parseInt(document.getElementById('edit-days-' + id).value);
            
            if (!title) {
                alert('Название обязательно');
                return;
            }
            
            const status = document.getElementById('status');
            status.textContent = 'Сохранение...';
            
            try {
                let coverUrl = oldCoverUrl;
                
                const coverFileInput = document.getElementById('edit-cover-file-' + id);
                const newCoverData = coverFileInput.dataset.newCover;
                
                if (newCoverData) {
                    status.textContent = 'Загрузка обложки...';
                    
                    const response = await fetch(newCoverData);
                    const blob = await response.blob();
                    
                    const fileName = 'cover_' + Date.now() + '_' + id + '.jpg';
                    const { error: uploadError, data } = await supabase.storage
                        .from('covers')
                        .upload(fileName, blob, {
                            cacheControl: '3600',
                            upsert: false
                        });
                    
                    if (uploadError) throw uploadError;
                    
                    const { data: { publicUrl } } = supabase.storage
                        .from('covers')
                        .getPublicUrl(fileName);
                    
                    coverUrl = publicUrl;
                }
                
                const { error } = await supabase
                    .from('tracks')
                    .update({
                        title,
                        description: description || null,
                        price,
                        duration_days: days,
                        cover_url: coverUrl
                    })
                    .eq('id', id);
                
                if (error) throw error;
                
                status.textContent = '✅ Изменения сохранены!';
                status.style.borderColor = '#4CAF50';
                
                setTimeout(() => {
                    status.textContent = '';
                    status.style.borderColor = '#e0e0e0';
                }, 3000);
                
                loadTracks();
            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                status.style.borderColor = '#e94560';
                console.error('Ошибка сохранения:', e);
            }
        };

        window.copyLink = async (link, title) => {
            closeAllMenus();
            try {
                await navigator.clipboard.writeText(link);
                
                const status = document.getElementById('status');
                status.textContent = '✅ Ссылка скопирована!';
                status.style.borderColor = '#4CAF50';
                
                setTimeout(() => {
                    status.textContent = '';
                    status.style.borderColor = '#e0e0e0';
                }, 3000);
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = link;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                alert('Ссылка скопирована!');
            }
        };

        window.downloadQR = async (qrUrl, title) => {
            closeAllMenus();
            try {
                const response = await fetch(qrUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'QR-' + title.replace(/[^a-z0-9а-яё]/gi, '_') + '.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Ошибка скачивания:', error);
                window.open(qrUrl, '_blank');
            }
        };

        window.toggleTrack = async (id, active) => {
            closeAllMenus();
            const { error } = await supabase
                .from('tracks')
                .update({ active })
                .eq('id', id);
            
            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                loadTracks();
            }
        };

        window.deleteTrack = async (id) => {
            closeAllMenus();
            if (!confirm('Удалить этот трек?')) return;
            
            const { error } = await supabase
                .from('tracks')
                .delete()
                .eq('id', id);
            
            if (error) {
                alert('Ошибка удаления: ' + error.message);
            } else {
                loadTracks();
            }
        };

        window.uploadTrack = async () => {
            const status = document.getElementById('modalStatus');
            const uploadBtn = document.getElementById('uploadBtn');
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const price = parseInt(document.getElementById('price').value) || 0;
            const days = parseInt(document.getElementById('days').value) || 7;
            const file = document.getElementById('mp3file').files[0];

            if (!file || !title) { 
                alert('Заполните название и выберите аудиофайл'); 
                return; 
            }

            const { data: { user } } = await supabase.auth.getUser();
            
            if (!user) {
                alert('Вы не авторизованы. Войдите в систему.');
                return;
            }

            status.textContent = 'Загрузка аудио...';
            uploadBtn.disabled = true;

            try {
                const audioFileName = Date.now() + '_' + Math.random().toString(36).substr(2, 9) + '_' + file.name.replace(/\s/g, '_').replace(/[^a-zA-Z0-9._-]/g, '');
                
                const { error: audioUploadError } = await supabase.storage
                    .from('tracks')
                    .upload(audioFileName, file, {
                        cacheControl: '3600',
                        upsert: false
                    });
                
                if (audioUploadError) throw audioUploadError;

                const { data: { publicUrl: audioUrl } } = supabase.storage
                    .from('tracks')
                    .getPublicUrl(audioFileName);

                status.textContent = 'Определение длительности...';
                
                const duration = await getAudioDuration(audioUrl);

                let coverUrl = null;
                if (selectedCoverFile) {
                    status.textContent = 'Загрузка обложки...';
                    
                    const coverFileName = 'cover_' + Date.now() + '.jpg';
                    const { error: coverUploadError } = await supabase.storage
                        .from('covers')
                        .upload(coverFileName, selectedCoverFile, {
                            cacheControl: '3600',
                            upsert: false
                        });
                    
                    if (coverUploadError) throw coverUploadError;
                    
                    const { data: { publicUrl: coverPublicUrl } } = supabase.storage
                        .from('covers')
                        .getPublicUrl(coverFileName);
                    
                    coverUrl = coverPublicUrl;
                }

                status.textContent = 'Создание записи в базе...';
                
                const trackData = {
                    title,
                    description: description || null,
                    price,
                    duration_days: days,
                    duration: Math.round(duration),
                    file_url: audioUrl,
                    active: true,
                    play_count: 0
                };
                
                if (coverUrl) {
                    trackData.cover_url = coverUrl;
                }
                
                const { error: dbError, data: dbData } = await supabase
                    .from('tracks')
                    .insert(trackData)
                    .select();

                if (dbError) throw dbError;
                
                status.textContent = '✅ Трек добавлен!';
                status.style.borderColor = '#4CAF50';
                
                setTimeout(() => {
                    closeAddModal();
                    loadTracks();
                }, 1500);
                
            } catch (e) {
                console.error('Ошибка:', e);
                status.textContent = '❌ Ошибка: ' + e.message;
                status.style.borderColor = '#e94560';
            } finally {
                uploadBtn.disabled = false;
            }
        };

        function getAudioDuration(url) {
            return new Promise((resolve, reject) => {
                const audio = new Audio();
                audio.preload = 'metadata';
                
                const timeout = setTimeout(() => {
                    audio.src = '';
                    reject(new Error('Таймаут'));
                }, 10000);
                
                audio.addEventListener('loadedmetadata', () => {
                    clearTimeout(timeout);
                    audio.src = '';
                    resolve(audio.duration);
                });
                
                audio.addEventListener('error', (e) => {
                    clearTimeout(timeout);
                    audio.src = '';
                    reject(new Error('Не удалось определить длительность'));
                });
                
                audio.src = url + '?t=' + Date.now();
            });
        }
    </script>
</body>
</html>
