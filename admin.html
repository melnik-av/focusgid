<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            background: #fafafa; 
            color: #1a1a1a; 
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        h1 { 
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }
        
        .add-track-btn {
            background: #1a1a1a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            width: auto;
            margin: 0;
        }
        
        .add-track-btn:hover {
            background: #333333;
        }
        
        input, textarea, button { 
            padding: 14px 16px; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid #e0e0e0; 
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        input, textarea { 
            background: #ffffff; 
            color: #1a1a1a; 
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        input::placeholder, textarea::placeholder { 
            color: #999999; 
        }
        
        textarea { 
            resize: vertical; 
            min-height: 80px; 
        }
        
        button { 
            background: #1a1a1a; 
            color: #ffffff; 
            cursor: pointer; 
            font-weight: 500; 
            border: none;
        }
        
        button:hover { 
            background: #333333; 
        }
        
        button:disabled { 
            background: #cccccc; 
            cursor: not-allowed; 
        }
        
        #status { 
            margin-top: 20px; 
            padding: 16px; 
            background: #ffffff; 
            border: 1px solid #e0e0e0;
            border-radius: 8px; 
            min-height: 20px; 
            font-size: 14px;
        }
        
        .hidden { display: none !important; }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .user-email { 
            font-size: 14px; 
            color: #666666; 
            margin-top: 4px;
        }
        
        .logout-btn { 
            background: #ffffff; 
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            width: auto; 
            padding: 8px 16px; 
            font-size: 14px; 
            margin: 0; 
        }
        
        .logout-btn:hover { 
            background: #f5f5f5; 
            border-color: #1a1a1a;
        }
        
        .track-item {
            padding: 20px; 
            background: #ffffff; 
            margin: 16px 0; 
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            position: relative;
        }
        
        .track-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        
        .track-header-content {
            flex: 1;
            min-width: 0;
        }
        
        .track-title { 
            font-weight: 600; 
            font-size: 18px; 
            margin-bottom: 6px; 
        }
        
        .track-description { 
            font-size: 14px; 
            color: #666666; 
            margin-bottom: 8px; 
            line-height: 1.5; 
        }
        
        .track-meta { 
            font-size: 13px; 
            color: #999999;
            margin-bottom: 12px;
        }
        
        .track-cover-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .track-cover-thumb img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .track-link { 
            font-size: 12px; 
            color: #999999; 
            word-break: break-all;
            font-family: 'SF Mono', Monaco, monospace;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 6px;
        }
        
        .stats-row {
            display: flex;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value { 
            font-size: 22px; 
            font-weight: 700; 
            color: #1a1a1a; 
            margin-bottom: 4px; 
        }
        
        .stat-label { 
            font-size: 11px; 
            color: #999999; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        
        .menu-button {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #999999;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        .menu-button:hover {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        
        .dropdown-menu {
            position: absolute;
            top: 60px;
            right: 20px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            z-index: 100;
            display: none;
            overflow: hidden;
        }
        
        .dropdown-menu.active {
            display: block;
        }
        
        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            margin: 0;
            border-radius: 0;
        }
        
        .dropdown-item:hover {
            background: #f5f5f5;
        }
        
        .dropdown-item.danger {
            color: #e94560;
        }
        
        .dropdown-item.danger:hover {
            background: #fff5f7;
        }
        
        .dropdown-divider {
            height: 1px;
            background: #e0e0e0;
            margin: 4px 0;
        }
        
        .dropdown-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        .field-label { 
            font-size: 13px; 
            color: #666666; 
            margin-bottom: 6px; 
            display: block;
            font-weight: 500;
        }
        
        .edit-form {
            background: #f5f5f5;
            padding: 24px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .edit-form input, .edit-form textarea { 
            background: #ffffff; 
            margin-bottom: 12px; 
        }
        
        .edit-form .field-label { 
            color: #1a1a1a; 
            font-weight: 600; 
        }
        
        .edit-actions { 
            display: flex; 
            gap: 8px; 
            margin-top: 20px; 
        }
        
        .edit-actions button { 
            flex: 1; 
        }
        
        .total-stats {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }
        
        .total-stats h3 { 
            margin: 0 0 20px 0; 
            font-size: 18px;
            font-weight: 600;
        }
        
        .total-stats .stats-row { 
            margin: 0; 
        }
        
        .cover-upload { 
            margin: 16px 0; 
        }
        
        .cover-preview {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 2px dashed #e0e0e0;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        
        .cover-preview:hover {
            border-color: #1a1a1a;
            background: #f0f0f0;
        }
        
        .cover-preview img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            display: block;
        }
        
        .cover-preview-placeholder { 
            color: #999999; 
            font-size: 13px; 
            text-align: center; 
            padding: 20px;
            pointer-events: none;
            line-height: 1.4;
        }
        
        .cover-preview-placeholder .cover-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        
        .cover-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0;
            margin: 0;
            transition: all 0.2s;
            z-index: 2;
        }
        
        .cover-delete-btn:hover {
            background: #e94560;
            transform: scale(1.1);
        }
        
        #loginForm {
            max-width: 400px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }
        
        #loginForm h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
        }
        
        .menu-overlay.active {
            display: block;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 24px 0 24px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #666666;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: #e0e0e0;
            color: #1a1a1a;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-body input,
        .modal-body textarea {
            margin: 8px 0 16px 0;
        }
        
        .modal-footer {
            padding: 0 24px 24px 24px;
            display: flex;
            gap: 8px;
        }
        
        .modal-footer button {
            flex: 1;
        }
        
        .btn-cancel-modal {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
        }
        
        .btn-cancel-modal:hover {
            background: #f5f5f5;
            border-color: #1a1a1a;
        }
        
        .modal-status {
            margin: 0 24px 16px 24px;
            padding: 12px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-height: 20px;
        }
        
        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .add-track-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div id="loginError" style="color: #e94560; margin-top: 10px; font-size: 14px;"></div>
    </div>
    
    <div id="adminPanel" class="hidden">
        <div class="user-info">
            <div>
                <div style="font-weight: 600; font-size: 14px;">Вы вошли как:</div>
                <div class="user-email" id="userEmail">—</div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <div class="header">
            <h1>Админ-панель</h1>
            <button class="add-track-btn" onclick="openAddModal()">+ Добавить трек</button>
        </div>
        
        <div class="total-stats" id="totalStats">
            <h3>📊 Общая статистика</h3>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalTracks">0</div>
                    <div class="stat-label">Всего треков</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPlays">0</div>
                    <div class="stat-label">Всего прослушиваний</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="topTrack">—</div>
                    <div class="stat-label">Самый популярный</div>
                </div>
            </div>
        </div>
        
        <h2>Список треков</h2>
        <div id="tracksList"></div>
    </div>
    
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Добавить трек</h2>
                <button class="modal-close" onclick="closeAddModal()">✕</button>
            </div>
            <div class="modal-body">
                <label class="field-label">Название трека *</label>
                <input type="text" id="title" placeholder="Например: Прогулка по старому городу">
                
                <label class="field-label">Описание (аннотация)</label>
                <textarea id="description" placeholder="2-3 предложения о прогулке..."></textarea>
                
                <div class="cover-upload">
                    <label class="field-label">Обложка трека</label>
                    <div class="cover-preview" id="coverPreview" onclick="document.getElementById('coverFile').click()">
                        <div class="cover-preview-placeholder">
                            <span class="cover-icon">+</span>
                            Нажмите чтобы добавить обложку
                        </div>
                    </div>
                    <input type="file" id="coverFile" accept="image/*" style="display: none;">
                </div>
                
                <label class="field-label">Цена (руб)</label>
                <input type="number" id="price" placeholder="500" value="500">
                
                <label class="field-label">Дней доступа</label>
                <input type="number" id="days" placeholder="7" value="7">
                
                <label class="field-label">Аудиофайл (MP3) *</label>
                <input type="file" id="mp3file" accept="audio/mp3,audio/mpeg">
            </div>
            <div class="modal-status" id="modalStatus"></div>
            <div class="modal-footer">
                <button class="btn-cancel-modal" onclick="closeAddModal()">Отмена</button>
                <button onclick="uploadTrack()" id="uploadBtn">Загрузить трек</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
