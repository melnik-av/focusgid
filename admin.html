<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background: #1a1a2e; 
            color: white; 
            min-height: 100vh;
        }
        h1 { margin-top: 0; }
        input, textarea, button { 
            padding: 12px; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px;
            font-family: inherit;
        }
        input, textarea { 
            background: rgba(255,255,255,0.1); 
            color: white; 
        }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.5); }
        textarea { resize: vertical; min-height: 80px; }
        button { 
            background: #e94560; 
            color: white; 
            cursor: pointer; 
            font-weight: 600; 
            transition: background 0.2s;
        }
        button:hover { background: #d63851; }
        button:disabled { background: #4a4a5a; cursor: not-allowed; }
        #status { 
            margin-top: 20px; 
            padding: 15px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 8px; 
            min-height: 20px; 
        }
        .hidden { display: none !important; }
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-email { font-size: 14px; color: #a0a0b0; }
        .logout-btn { background: #666; width: auto; padding: 8px 16px; font-size: 14px; margin: 0; }
        .logout-btn:hover { background: #555; }
        .track-item {
            padding: 20px; 
            background: rgba(255,255,255,0.05); 
            margin: 15px 0; 
            border-radius: 12px;
        }
        .track-title { font-weight: 600; font-size: 18px; margin-bottom: 8px; }
        .track-description { font-size: 14px; color: #a0a0b0; margin-bottom: 8px; font-style: italic; line-height: 1.5; }
        .track-meta { font-size: 14px; color: #6c6c7d; margin-bottom: 8px; }
        .track-link { font-size: 12px; color: #6c6c7d; word-break: break-all; font-family: monospace; margin-bottom: 15px; }
        
        .stats-row {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #e94560; margin-bottom: 5px; }
        .stat-label { font-size: 12px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-icon { font-size: 20px; margin-bottom: 5px; }
        
        .track-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .track-actions button { flex: 1; min-width: 120px; }
        .btn-copy { background: #4CAF50; }
        .btn-copy:hover { background: #45a049; }
        .btn-edit { background: #FF9800; }
        .btn-edit:hover { background: #F57C00; }
        .btn-save { background: #2196F3; }
        .btn-save:hover { background: #1976D2; }
        .btn-cancel { background: #757575; }
        .btn-cancel:hover { background: #616161; }
        .btn-delete { background: #8b0000; }
        .btn-delete:hover { background: #a00000; }
        .field-label { font-size: 14px; color: #a0a0b0; margin-bottom: 5px; display: block; }
        
        .qr-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .qr-label { font-size: 13px; color: #a0a0b0; margin-bottom: 15px; text-align: center; }
        .qr-wrapper { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .qr-code-container { background: white; padding: 15px; border-radius: 12px; display: inline-block; }
        .qr-code-container img { display: block; width: 150px; height: 150px; }
        .qr-actions { display: flex; gap: 10px; flex-direction: column; min-width: 180px; }
        .qr-actions button { width: 100%; }
        .btn-qr-download { background: #2196F3; }
        .btn-qr-download:hover { background: #1976D2; }
        
        .edit-form {
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .edit-form input, .edit-form textarea { background: rgba(255,255,255,0.15); margin-bottom: 12px; }
        .edit-form .field-label { color: #d0d0e0; font-weight: 600; }
        .edit-actions { display: flex; gap: 10px; margin-top: 15px; }
        .edit-actions button { flex: 1; }
        
        .total-stats {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2), rgba(22, 33, 62, 0.5));
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }
        .total-stats h3 { margin: 0 0 15px 0; font-size: 18px; }
        .total-stats .stats-row { margin: 0; }
        
        /* Стили для загрузки обложки */
        .cover-upload {
            margin: 15px 0;
        }
        .cover-preview {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 2px dashed rgba(255,255,255,0.3);
        }
        .cover-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-preview-placeholder {
            color: #a0a0b0;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .cover-actions {
            display: flex;
            gap: 10px;
        }
        .cover-actions button {
            flex: 1;
        }
        .btn-remove-cover {
            background: #8b0000;
        }
        .btn-remove-cover:hover {
            background: #a00000;
        }
        
        /* Миниатюра в списке треков */
        .track-cover-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .track-cover-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>🎛️ Админ-панель</h1>
    
    <div id="loginForm">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div id="loginError" style="color: #e94560; margin-top: 10px;"></div>
    </div>
    
    <div id="adminPanel" class="hidden">
        <div class="user-info">
            <div>
                <div style="font-weight: 600;">Вы вошли как:</div>
                <div class="user-email" id="userEmail">—</div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <!-- Общая статистика -->
        <div class="total-stats" id="totalStats">
            <h3>📊 Общая статистика</h3>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon">🎵</div>
                    <div class="stat-value" id="totalTracks">0</div>
                    <div class="stat-label">Всего треков</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">▶️</div>
                    <div class="stat-value" id="totalPlays">0</div>
                    <div class="stat-label">Всего прослушиваний</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="topTrack">—</div>
                    <div class="stat-label">Самый популярный</div>
                </div>
            </div>
        </div>
        
        <h2>Добавить трек</h2>
        
        <label class="field-label">Название трека *</label>
        <input type="text" id="title" placeholder="Например: Прогулка по старому городу">
        
        <label class="field-label">Описание (аннотация)</label>
        <textarea id="description" placeholder="2-3 предложения о прогулке..."></textarea>
        
        <!-- Загрузка обложки -->
        <div class="cover-upload">
            <label class="field-label">Обложка трека</label>
            <div class="cover-preview" id="coverPreview">
                <div class="cover-preview-placeholder">📷<br>Загрузите обложку</div>
            </div>
            <input type="file" id="coverFile" accept="image/*" style="display: none;">
            <div class="cover-actions">
                <button onclick="document.getElementById('coverFile').click()" style="background: #2196F3;">
                     Выбрать обложку
                </button>
                <button class="btn-remove-cover" onclick="removeCover()">
                    🗑️ Удалить
                </button>
            </div>
        </div>
        
        <label class="field-label">Цена (руб)</label>
        <input type="number" id="price" placeholder="500" value="500">
        
        <label class="field-label">Дней доступа</label>
        <input type="number" id="days" placeholder="7" value="7">
        
        <label class="field-label">Аудиофайл (MP3) *</label>
        <input type="file" id="mp3file" accept="audio/mp3,audio/mpeg">
        
        <button onclick="uploadTrack()" id="uploadBtn">Загрузить трек</button>
        <div id="status"></div>
        
        <h2 style="margin-top: 40px;">Список треков</h2>
        <div id="tracksList"></div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let selectedCoverFile = null;
        let selectedCoverUrl = null;

        window.login = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.textContent = '❌ ' + error.message;
            }
        };

        window.logout = async () => {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert('Ошибка выхода: ' + error.message);
            }
        };

        supabase.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('userEmail').textContent = session.user.email;
                loadTracks();
            } else {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            }
        });

        // Обработка выбора обложки
        document.getElementById('coverFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedCoverFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedCoverUrl = e.target.result;
                    document.getElementById('coverPreview').innerHTML = 
                        `<img src="${selectedCoverUrl}" alt="Обложка">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Удалить обложку
        window.removeCover = () => {
            selectedCoverFile = null;
            selectedCoverUrl = null;
            document.getElementById('coverFile').value = '';
            document.getElementById('coverPreview').innerHTML = 
                '<div class="cover-preview-placeholder">📷<br>Загрузите обложку</div>';
        };

        function getQRUrl(text, size = 200) {
            return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}&margin=10&color=000000&bgcolor=ffffff`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function loadTracks() {
            const { data: tracks, error } = await supabase
                .from('tracks')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Ошибка загрузки:', error);
                return;
            }
            
            updateTotalStats(tracks);
            
            const list = document.getElementById('tracksList');
            if (!tracks || tracks.length === 0) {
                list.innerHTML = '<div style="color: #a0a0b0;">Нет треков</div>';
                return;
            }
            
            const playerUrl = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');
            
            list.innerHTML = tracks.map(t => {
                const trackLink = `${playerUrl}?track=${t.id}`;
                const descriptionHtml = t.description 
                    ? `<div class="track-description">"${t.description}"</div>` 
                    : '';
                const qrUrl = getQRUrl(trackLink, 200);
                const playCount = t.play_count || 0;
                const lastPlayed = formatDate(t.last_played_at);
                const coverHtml = t.cover_url 
                    ? `<div class="track-cover-thumb"><img src="${t.cover_url}" alt="${t.title}"></div>`
                    : '';
                
                return `
                    <div class="track-item" id="track-${t.id}">
                        ${coverHtml}
                        <div class="track-title">${t.title}</div>
                        ${descriptionHtml}
                        <div class="track-meta">${t.price} руб, ${t.duration_days} дней</div>
                        
                        <div class="stats-row">
                            <div class="stat-card">
                                <div class="stat-icon">▶️</div>
                                <div class="stat-value">${playCount}</div>
                                <div class="stat-label">Прослушиваний</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">🕐</div>
                                <div class="stat-value" style="font-size: 14px;">${lastPlayed}</div>
                                <div class="stat-label">Последнее прослушивание</div>
                            </div>
                        </div>
                        
                        <div class="track-link">${trackLink}</div>
                        
                        <div class="qr-section">
                            <div class="qr-label">📱 QR-код для быстрого доступа</div>
                            <div class="qr-wrapper">
                                <div class="qr-code-container">
                                    <img src="${qrUrl}" alt="QR-код" crossorigin="anonymous">
                                </div>
                                <div class="qr-actions">
                                    <button class="btn-qr-download" onclick="downloadQR('${qrUrl}', '${t.title.replace(/'/g, "\\'")}')">
                                         Скачать QR
                                    </button>
                                    <button class="btn-copy" onclick="copyLink('${trackLink}', '${t.title.replace(/'/g, "\\'")}')">
                                         Копировать ссылку
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="track-actions">
                            <button class="btn-edit" onclick="showEditForm('${t.id}', '${t.title.replace(/'/g, "\\'")}', '${(t.description || '').replace(/'/g, "\\'")}', ${t.price}, ${t.duration_days}, '${t.cover_url || ''}')">
                                ✏️ Редактировать
                            </button>
                            <button onclick="toggleTrack('${t.id}', ${!t.active})">
                                ${t.active ? 'Отключить' : 'Включить'}
                            </button>
                            <button class="btn-delete" onclick="deleteTrack('${t.id}')">Удалить</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateTotalStats(tracks) {
            const totalTracks = tracks.length;
            const totalPlays = tracks.reduce((sum, t) => sum + (t.play_count || 0), 0);
            
            let topTrack = tracks.reduce((max, t) => {
                return (t.play_count || 0) > (max.play_count || 0) ? t : max;
            }, tracks[0] || { play_count: 0, title: '—' });
            
            document.getElementById('totalTracks').textContent = totalTracks;
            document.getElementById('totalPlays').textContent = totalPlays;
            document.getElementById('topTrack').textContent = topTrack.play_count > 0 ? topTrack.title : '—';
        }

        window.showEditForm = (id, title, description, price, days, coverUrl) => {
            const trackItem = document.getElementById(`track-${id}`);
            const existingForm = trackItem.querySelector('.edit-form');
            
            if (existingForm) {
                existingForm.remove();
                return;
            }
            
            const coverPreviewHtml = coverUrl 
                ? `<img src="${coverUrl}" alt="Обложка" style="width: 100%; height: 100%; object-fit: cover;">`
                : '<div class="cover-preview-placeholder"><br>Нет обложки</div>';
            
            const form = document.createElement('div');
            form.className = 'edit-form';
            form.innerHTML = `
                <label class="field-label">Название трека</label>
                <input type="text" id="edit-title-${id}" value="${title}">
                
                <label class="field-label">Описание</label>
                <textarea id="edit-description-${id}">${description}</textarea>
                
                <label class="field-label">Обложка</label>
                <div class="cover-preview" id="edit-cover-preview-${id}">
                    ${coverPreviewHtml}
                </div>
                <input type="file" id="edit-cover-file-${id}" accept="image/*" style="display: none;">
                <div class="cover-actions">
                    <button onclick="document.getElementById('edit-cover-file-${id}').click()" style="background: #2196F3;">
                        📷 Изменить обложку
                    </button>
                    <button class="btn-remove-cover" onclick="removeEditCover('${id}')">
                        🗑️ Удалить
                    </button>
                </div>
                
                <label class="field-label">Цена (руб)</label>
                <input type="number" id="edit-price-${id}" value="${price}">
                
                <label class="field-label">Дней доступа</label>
                <input type="number" id="edit-days-${id}" value="${days}">
                
                <div class="edit-actions">
                    <button class="btn-save" onclick="saveTrack('${id}', '${coverUrl}')">💾 Сохранить</button>
                    <button class="btn-cancel" onclick="loadTracks()">Отмена</button>
                </div>
            `;
            
            trackItem.appendChild(form);
            
            // Обработчик изменения обложки в форме редактирования
            document.getElementById(`edit-cover-file-${id}`).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.getElementById(`edit-cover-preview-${id}`).innerHTML = 
                            `<img src="${e.target.result}" alt="Обложка">`;
                        document.getElementById(`edit-cover-file-${id}`).dataset.newCover = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        };

        window.removeEditCover = (id) => {
            document.getElementById(`edit-cover-preview-${id}`).innerHTML = 
                '<div class="cover-preview-placeholder">📷<br>Нет обложки</div>';
            document.getElementById(`edit-cover-file-${id}`).value = '';
            delete document.getElementById(`edit-cover-file-${id}`).dataset.newCover;
        };

        window.saveTrack = async (id, oldCoverUrl) => {
            const title = document.getElementById(`edit-title-${id}`).value.trim();
            const description = document.getElementById(`edit-description-${id}`).value.trim();
            const price = parseInt(document.getElementById(`edit-price-${id}`).value);
            const days = parseInt(document.getElementById(`edit-days-${id}`).value);
            
            if (!title) {
                alert('Название обязательно');
                return;
            }
            
            const status = document.getElementById('status');
            status.textContent = '⏳ Сохранение...';
            
            try {
                let coverUrl = oldCoverUrl;
                
                // Проверяем есть ли новая обложка
                const coverFileInput = document.getElementById(`edit-cover-file-${id}`);
                const newCoverData = coverFileInput.dataset.newCover;
                
                if (newCoverData) {
                    status.textContent = ' Загрузка обложки...';
                    
                    // Конвертируем base64 в blob
                    const response = await fetch(newCoverData);
                    const blob = await response.blob();
                    
                    const fileName = `cover_${Date.now()}_${id}.jpg`;
                    const { error: uploadError, data } = await supabase.storage
                        .from('covers')
                        .upload(fileName, blob, {
                            cacheControl: '3600',
                            upsert: false
                        });
                    
                    if (uploadError) throw uploadError;
                    
                    const { data: { publicUrl } } = supabase.storage
                        .from('covers')
                        .getPublicUrl(fileName);
                    
                    coverUrl = publicUrl;
                }
                
                const { error } = await supabase
                    .from('tracks')
                    .update({
                        title,
                        description: description || null,
                        price,
                        duration_days: days,
                        cover_url: coverUrl
                    })
                    .eq('id', id);
                
                if (error) throw error;
                
                status.textContent = '✅ Изменения сохранены!';
                status.style.background = 'rgba(76, 175, 80, 0.2)';
                
                setTimeout(() => {
                    status.textContent = '';
                    status.style.background = 'rgba(255,255,255,0.1)';
                },
